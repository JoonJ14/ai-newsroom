name: Collect AI News

on:
  # Scheduling now comes from Supabase Cron, which starts this workflow through
  # the REST API (workflow_dispatch) at fixed New York times. GitHub's own
  # scheduler was creating runs hours late. See docs/scheduling.md.
  #
  # Forks without the Supabase trigger: uncomment the schedule block below to
  # fall back to GitHub's scheduler (expect delays of up to several hours).
  # schedule:
  #   # Run every 6 hours: midnight, 6am, noon, 6pm UTC
  #   - cron: '0 */6 * * *'
  workflow_dispatch: # Supabase Cron, or manual trigger from the GitHub UI

# Neither job writes to the repo.
permissions:
  contents: read

# One run at a time. The upsert reads each row's stored metadata, merges and
# writes it back; two overlapping runs could each write back a stale copy.
# A run dispatched while one is in progress waits for it.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run collectors
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # The workflow's own token, for the GitHub release sources. Unauthenticated
          # API calls share 60/hour per runner IP; on 2026-10-06 all three release
          # sources failed with "rate limit exceeded". Reading public releases
          # needs no permission beyond the read-only one above.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run collect

      # Every row after 90 days; rows the editor rated 2 or lower after 14
      # (src/utils/retention.ts). Unjudged rows keep the 90 days.
      - name: Cleanup old and low-rated items
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Optional repository variables; unset means 2 and 14 days, 0 switches the rule off
          CLEANUP_LOW_IMPORTANCE_MAX: ${{ vars.CLEANUP_LOW_IMPORTANCE_MAX }}
          CLEANUP_LOW_IMPORTANCE_DAYS: ${{ vars.CLEANUP_LOW_IMPORTANCE_DAYS }}
        run: npm run cleanup

  # The AI editor judges what collection just stored (src/editor/, docs/editor.md).
  # Its own job, so that only it can request an OIDC token, and so that it can
  # fail without failing collection: `continue-on-error` keeps the run green, and
  # anything left unjudged is retried on the next run. The digest and the MCP
  # server read the judgments.
  editor:
    needs: collect
    # Also after a failed collect: earlier runs' items may still need judging
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      # Workload identity federation: lets the job ask GitHub for a short-lived
      # OIDC token, which Anthropic exchanges for an API token. No write access.
      id-token: write
    # Shared with editor-backfill.yml, so two editors never judge the same rows
    concurrency:
      group: editor
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Judge new items
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Workload identity federation: the IDs are repository variables (not
          # secrets: they identify, they don't authenticate). This repository
          # holds no Anthropic key. ANTHROPIC_API_KEY is for forks without
          # federation; here it is empty. While the federation variables are
          # set, a failed exchange does not fall back to it (docs/editor.md).
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EDITOR_MODEL: ${{ vars.EDITOR_MODEL }}
        run: npm run editor
