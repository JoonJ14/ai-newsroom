name: Collect AI News

on:
  # Scheduling now comes from Supabase Cron, which starts this workflow through
  # the REST API (workflow_dispatch) at fixed New York times. GitHub's own
  # scheduler was creating runs hours late. See docs/scheduling.md.
  #
  # Forks without the Supabase trigger: uncomment the schedule block below to
  # fall back to GitHub's scheduler (expect delays of up to several hours).
  # schedule:
  #   # Run every 6 hours: midnight, 6am, noon, 6pm UTC
  #   - cron: '0 */6 * * *'
  workflow_dispatch: # Supabase Cron, or manual trigger from the GitHub UI

# Neither job writes to the repo.
permissions:
  contents: read

# One run at a time. The upsert reads each row's stored metadata, merges and
# writes it back; two overlapping runs could each write back a stale copy.
# A run dispatched while one is in progress waits for it.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run collectors
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # The workflow's own token, for the GitHub release sources. Unauthenticated
          # API calls share 60/hour per runner IP; on 2026-10-06 all three release
          # sources failed with "rate limit exceeded". Reading public releases
          # needs no permission beyond the read-only one above.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run collect

      - name: Cleanup old items (90-day retention)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run cleanup
