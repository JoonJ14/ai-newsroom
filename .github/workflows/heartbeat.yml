name: Heartbeat

on:
  schedule:
    # Weekly, Mondays at 12:00 UTC
    - cron: '0 12 * * 1'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write
      # Required by the re-enable step below; contents:write alone cannot
      # toggle workflow state.
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          # Keep the GITHUB_TOKEN credentials available to the push step below
          persist-credentials: true

      - name: Update heartbeat timestamp
        run: |
          {
            echo "# Generated by .github/workflows/heartbeat.yml — no functional purpose."
            echo "# GitHub disables scheduled workflows after 60 days of repo inactivity."
            echo "# This weekly commit keeps the repo active so collect.yml and digest.yml keep running."
            date -u +%Y-%m-%dT%H:%M:%SZ
          } > .github/heartbeat.txt

      # Pushed to a dedicated branch rather than main.
      #
      # The 60-day rule counts REPOSITORY activity, not activity on the default
      # branch, so a commit here keeps collect.yml and digest.yml enabled just
      # as well. Writing to main instead would force main's protection ruleset
      # to carry an exception, and on a user-owned repo the GitHub Actions app
      # cannot be a bypass actor at all ("must be part of the ruleset source or
      # owner organization"). Keeping the heartbeat off main means main needs no
      # exception, so the protection has no hole to walk through.
      - name: Commit and push to the heartbeat branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B heartbeat
          git add .github/heartbeat.txt
          git diff --staged --quiet || git commit -m "chore: heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force origin heartbeat

      # Belt and braces: if the scheduled workflows were ever disabled — by the
      # inactivity rule or by hand — re-enable them here rather than discovering
      # weeks later that no news was collected.
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Queried through the API: `gh workflow view` has no --json flag, so
          # the obvious-looking form fails and every state reads as unknown,
          # which makes the step silently do nothing while reporting success.
          states=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" \
            --jq '.workflows[] | "\(.path) \(.state)"')
          echo "$states"

          echo "$states" | while read -r path state; do
            case "$path" in
              *collect.yml|*digest.yml|*heartbeat.yml)
                case "$state" in
                  disabled_inactivity|disabled_manually)
                    gh workflow enable "$(basename "$path")" \
                      && echo "re-enabled $path (was $state)"
                    ;;
                esac
                ;;
            esac
          done
