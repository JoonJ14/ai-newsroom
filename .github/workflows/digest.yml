name: Daily AI News Digest

on:
  # Scheduling now comes from Supabase Cron, which starts this workflow through
  # the REST API (workflow_dispatch) at fixed New York times. GitHub's own
  # scheduler was creating runs hours late. See docs/scheduling.md.
  #
  # Forks without the Supabase trigger: uncomment the schedule block below to
  # fall back to GitHub's scheduler (expect delays of up to several hours).
  # schedule:
  #   # Runs daily at 11:45 AM Eastern (15:45 UTC during EDT)
  #   - cron: '45 15 * * *'
  workflow_dispatch: # Supabase Cron, or manual trigger from the GitHub UI

# Neither job writes to the repo.
permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send digest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm run digest
